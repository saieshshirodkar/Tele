name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull LFS files
        run: |
          git lfs install --local
          git lfs fetch
          git lfs checkout

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 9.1

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Rename APK with version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          else
            VERSION="${{ github.ref_name }}"
          fi
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Tele-${VERSION}.apk

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          files: app/build/outputs/apk/release/Tele-*.apk
